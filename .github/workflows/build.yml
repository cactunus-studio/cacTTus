name: Build experimental cacTTus
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      apk_url:
        description: Direct HTTPS download URL for TikTok 47.7.1 APK
        required: false
        type: string
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Download and verify source APK and tools
        env:
          APK_URL: ${{ inputs.apk_url || secrets.CACTTUS_APK_URL }}
        run: |
          set -eu
          case "$APK_URL" in https://*) ;; *) echo "Set CACTTUS_APK_URL or provide apk_url" >&2; exit 1 ;; esac
          curl --fail --location --proto '=https' --proto-redir '=https' "$APK_URL" -o /tmp/source.apk
          echo '3b68b645a9d6ab69336152c613e644aaaf8d09aa001413518f27b4517be07b0c  /tmp/source.apk' | sha256sum -c
          curl -fsSL https://github.com/iBotPeaches/Apktool/releases/download/v3.0.3/apktool_3.0.3.jar -o /tmp/apktool.jar
          echo 'dbf930b076c6b9be08d57c449cacefc3bdd6b71ebd59b3066fc0e1f5b14f9423  /tmp/apktool.jar' | sha256sum -c
          curl -fsSL https://github.com/patrickfav/uber-apk-signer/releases/download/v1.3.0/uber-apk-signer-1.3.0.jar -o /tmp/signer.jar
          echo 'e1299fd6fcf4da527dd53735b56127e8ea922a321128123b9c32d619bba1d835  /tmp/signer.jar' | sha256sum -c
      - name: Decode and patch
        run: |
          java -Xmx6g -jar /tmp/apktool.jar d --no-res -j 2 -o /tmp/decoded /tmp/source.apk
          python3 scripts/patch_region.py /tmp/decoded
      - name: Build and sign
        run: |
          java -Xmx6g -jar /tmp/apktool.jar b -j 2 /tmp/decoded -o /tmp/cacttus.apk
          java -jar /tmp/signer.jar --apks /tmp/cacttus.apk --out /tmp/output
      - uses: actions/upload-artifact@v4
        with:
          name: cacttus-experimental
          path: /tmp/output/*debugSigned.apk
          if-no-files-found: error
